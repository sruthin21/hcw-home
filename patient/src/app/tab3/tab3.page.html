<ion-header>
  <ion-toolbar>
    <ion-title>
      My Profile
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-header ion-padding ion-text-center">
    <div class="avatar-container">
      <div class="avatar">
        <img src="https://via.placeholder.com/150" alt="Profile Photo">
      </div>
      <div class="edit-avatar">
        <ion-icon name="camera"></ion-icon>
      </div>
    </div>
    <h1>John Doe</h1>
    <div class="account-type">Patient</div>
    
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-value">10</div>
        <div class="stat-label">Consultations</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">4.5</div>
        <div class="stat-label">Avg. Rating</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">3</div>
        <div class="stat-label">Upcoming</div>
      </div>
    </div>
  </div>

  <div class="info-card">
    <h3>Personal Information</h3>
    <div class="info-item">
      <div class="label">Phone</div>
      <div class="value">+1-234-567-8901</div>
    </div>
    <div class="info-item">
      <div class="label">Country</div>
      <div class="value">USA</div>
    </div>
    <div class="info-item">
      <div class="label">Language</div>
      <div class="value">English</div>
    </div>
    <div class="info-item">
      <div class="label">Gender</div>
      <div class="value">Male</div>
    </div>
  </div>
  
  <div class="medical-info-card">
    <h3>Medical Information</h3>
    <div class="medical-info-content">
      <div class="medical-info-item">
        <ion-icon name="fitness-outline"></ion-icon>
        <div class="info-details">
          <h4>Blood Type</h4>
          <p>A+</p>
        </div>
      </div>
      
      <div class="medical-info-item">
        <ion-icon name="medkit-outline"></ion-icon>
        <div class="info-details">
          <h4>Allergies</h4>
          <p>Penicillin, Peanuts</p>
        </div>
      </div>
      
      <div class="medical-info-item">
        <ion-icon name="pulse-outline"></ion-icon>
        <div class="info-details">
          <h4>Chronic Conditions</h4>
          <p>None</p>
        </div>
      </div>
    </div>
  </div>
  
 
  <div class="ion-padding">
    <ion-button expand="block" color="danger" fill="outline" class="sign-out-button">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Sign Out
    </ion-button>
  </div>
</ion-content>
